[project]
name = "agent-action-gate"
version = "0.2.0"
description = "Gate/Prove MCP server: deny unattended destructive agent tool calls. Instant Audit + consultation on a2zsoc.com."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ahmed Hassan", email = "ahmed.alaa.hassan25@gmail.com" }]
keywords = ["mcp", "gate-prove", "agent-security", "a2zsoc"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AAH20/agent-action-gate"
Source = "https://github.com/AAH20/agent-action-gate"
InstantAudit = "https://a2zsoc.com/productized-services#instant-audit-tripwire"
Consultation = "https://a2zsoc.com/consultation"

[project.scripts]
aag = "aag.__main__:main"
agent-action-gate = "aag.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["aag*"]

[tool.setuptools.package-data]
aag = ["policy.default.json"]
